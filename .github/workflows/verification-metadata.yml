# Temporary: records the checksums a clean Linux runner needs. Never merged.
name: Verification metadata
on:
  push:
    branches: [ci/linux-verification-metadata]
permissions:
  contents: read
jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25
      - run: ./gradlew --write-verification-metadata sha256 test :app:assembleRelease assembleDebug -Pnexwatch.versionName=0.1.0 --no-configuration-cache
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
